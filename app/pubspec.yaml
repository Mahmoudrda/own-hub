name: own_hub
description: "Own Hub - a women-only fitness app for Egypt. Train, eat, track your cycle and your progress, in Arabic or English."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Localisation. Arabic is Modern Standard Arabic; the ARB files in lib/l10n are
  # generated from the mockup's translation dictionary and must not be hand-edited.
  flutter_localizations:
    sdk: flutter
  intl: any

  # @immutable on domain types, without pulling Flutter into the
  # domain layer — domain code must be testable with no widget tree.
  meta: any

  # Deterministic content-addressed ids for meal items, plates and grocery
  # lines (G5 §1.1/§1.4 specify sha1). NOT a security boundary: these are map
  # keys chosen so two of her own devices, offline, produce the same key for
  # the same plate. dart:core's hashCode is documented as varying between runs,
  # so it cannot be used for anything that has to agree across devices.
  crypto: any

  # The one place anything she does is written to the phone.
  #
  # Chosen over `path_provider` plus a file, and the deciding argument is the
  # store rather than the API. Apple's required-reason rules cover the
  # file-timestamp APIs a plugin needs to read and write a document in the
  # application support directory, so a file-based store means authoring and
  # maintaining `PrivacyInfo.xcprivacy` by hand; get it wrong and the upload is
  # refused at submission. `shared_preferences` ships its own privacy manifest
  # declaring the NSUserDefaults reason it uses, so the manifest travels with
  # the package and stays right when the package updates.
  #
  # It costs nothing in shape: the snapshot is still ONE JSON document under
  # one key, so a launch is one read and one decode — see
  # `lib/app_state/local_persistence.dart`. Nothing leaves the phone.
  shared_preferences: ^2.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  cloud_functions: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test-only: drives the real app on a simulator for the launch-video capture
  # (integration_test/demo_drive_test.dart). Ships in no binary.
  integration_test:
    sdk: flutter

  # Controls time in tests, so the five-second undo window is
  # verified deterministically rather than by sleeping.
  fake_async: any

  # Parses Dart source into a syntax tree for the G9 analytics guard
  # (`cycle_no_analytics_call_sites_test.dart`). Syntactic parsing only —
  # `parseString`, no resolution, no summaries — so it needs no build step and
  # no network. A regex over source cannot tell a call site from the word
  # appearing inside a comment or a string literal, and this guard's whole job
  # is to be trustworthy: PHASE1-FIXES.md #14 records a guard that shipped
  # matching nothing.
  analyzer: any

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:


  # Required for flutter gen-l10n to emit AppL10n from lib/l10n/*.arb.
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # Rubik carries both scripts. Regenerate with python3 6-v2/scripts/build_fonts.py
  assets:
    # The owner's illustrations, from Icons.pdf and More icons.pdf: 32 WebP
    # files at 1x, 2x and 3x, named in lib/theme/app_art.dart. Their licence
    # record is assets/art/LICENCE.md, which is deliberately not bundled.
    - assets/art/
    - assets/art/2.0x/
    - assets/art/3.0x/
    # Licence texts for the two OFL hand faces, shown on the licences page.
    - assets/fonts/OFL-LaBelleAurore.txt
    - assets/fonts/OFL-ArefRuqaa.txt
    - assets/fonts/OFL-Rubik.txt
    # Rahma's recipe book, about 210 KB of Egyptian colloquial Arabic, generated
    # by tool/extract_rahma_book.py and tool/build_rahma_recipes.py.
    #
    # In the binary rather than behind a network call, because the Eat tab has
    # to work with one bar on a metro platform at 7am. It is also why her text
    # is a JSON asset and not the ARB: `i18n_guard_test.dart` forbids Arabic
    # literals under lib/, which is exactly right — her colloquial is content,
    # the interface is Modern Standard, and they reach the screen through
    # different pipes so they cannot be smeared into each other.
    - assets/content/rahma_recipes.json

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-400.ttf
          weight: 400
        - asset: assets/fonts/Rubik-500.ttf
          weight: 500
        - asset: assets/fonts/Rubik-600.ttf
          weight: 600
        - asset: assets/fonts/Rubik-700.ttf
          weight: 700
    # The hand layer's two scripts (lib/theme/hand_tokens.dart). Used only for
    # short annotations and hand-set numerals, never for reading text. Both
    # SIL OFL 1.1; the licence texts sit beside them and are registered in
    # main.dart so they appear on the licences page.
    - family: LaBelleAurore
      fonts:
        - asset: assets/fonts/LaBelleAurore-400.ttf
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-400.ttf
          weight: 400
        - asset: assets/fonts/ArefRuqaa-700.ttf
          weight: 700

# ---------------------------------------------------------------- app icon
#
# The icon is the Own Hub mark, and the mark is geometry: the master is
# assets/brand/ownhub-mark.svg and both PNGs below are rendered from it, at
# their final size, by tool/render_brand_icons.py. Nothing is cropped or
# upscaled out of a bitmap, which is why the diagonal is still a clean edge at
# 20 px. After any change to the master:
#
#   1. python3 tool/render_brand_icons.py
#   2. dart run flutter_launcher_icons
#
# Then verify: ios/Runner/Assets.xcassets/AppIcon.appiconset/ has a 1024 entry,
# and android/app/src/main/res/mipmap-*/ic_launcher.png exist.
#
# icon-1024.png carries no alpha and no rounded corners. The OS applies the
# mask, and Apple rejects an icon with an alpha channel.
#
# adaptive_icon_background was #FFFFFF while icon-foreground.png was a mark in
# near-white paper, which on Android is a white mark on a white tile: an icon
# nobody can see. The background is now the rose the iOS tile has always used,
# so both platforms show the same thing.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#A24661"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  min_sdk_android: 24
