<?xml version="1.0" encoding="UTF-8"?>
<!--
  Own Hub stacked lockup: the concept 02 mark over the wordmark, the
  arrangement the identity sheet shows for this concept.

  THE NAME IS "OWN HUB". The sheet it came from says "OWN FIT"; that was the
  designer's placeholder and the owner corrected it. Anything set from this
  file says OWN HUB.

  The mark is `ownhub-mark.svg`, unchanged, translated by (400, 20).

  The wordmark is Rubik Medium (500), the family already bundled with the app
  under the SIL Open Font Licence 1.1 (assets/fonts/Rubik-500.ttf,
  assets/fonts/OFL-Rubik.txt). It is drawn here as outlines, so this file
  needs no font installed and cannot reflow.
    cap height       230        = 0.23 of the mark's height, as the sheet sets it
    letter-spacing   0.14 em     (140 units at upem 1000)
    word space       120 units + the tracking on either side
    baseline         y = 1375

  Rubik is a little narrower than the face on the sheet and its 500 weight a
  shade heavier; of the four weights licensed in this repository it is the
  closest match, and no font with an unclear licence was added to get nearer.

  To reset the wordmark: edit it as live text, then convert to outlines again.
  To recolour: change every "#1A5D74" below.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400"
     width="1800" height="1400" role="img" aria-label="Own Hub">
  <defs>
    <!-- Drawn in the mark's own 1000 x 1000 space: a mask resolves in the
         user space of the element that references it, and that element sits
         inside the translated group below. -->
    <mask id="blade-clearance" maskUnits="userSpaceOnUse"
          x="0" y="0" width="1000" height="1000">
      <rect width="1000" height="1000" fill="#fff"/>
      <path d="M 153.27 995.18 Q 585.19 559.65 846.73 4.82 Q 414.81 440.35 153.27 995.18 Z"
            fill="#000" stroke="#000" stroke-width="60" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- The mark -->
  <g transform="translate(400 20)">
    <circle cx="500" cy="500" r="327.5" fill="none" stroke="#1A5D74"
            stroke-width="125" mask="url(#blade-clearance)"/>
    <path d="M 153.27 995.18 Q 585.19 559.65 846.73 4.82 Q 414.81 440.35 153.27 995.18 Z" fill="#1A5D74"/>
  </g>

  <!-- The wordmark, one path per letter so a letter can be respaced alone -->
